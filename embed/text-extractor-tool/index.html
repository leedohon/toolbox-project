<!doctype html>
<html lang="ko">
<head>
  <!-- toolbox-indexing:start -->
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://bloggiedh.blogspot.com/2026/08/blog-post.html">
  <!-- toolbox-indexing:end -->
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>텍스트 정보 추출기</title>
  <link rel="stylesheet" href="../../assets/simple-tools.css?v=0.1.1"><link rel="stylesheet" href="../../assets/generated-tools.css?v=0.1.0"><link rel="stylesheet" href="../../assets/toolbox-i18n.css?v=0.1.0"><script src="../../assets/toolbox-i18n.js?v=0.3.0"></script><script src="../../assets/toolbox-ux.js?v=0.1.0"></script>
</head>
<body>
<article class="simple-tool" aria-label="텍스트 정보 추출기">
  <fieldset class="st-field st-mode"><legend class="st-label" data-ko="추출 유형" data-en="Extraction type">추출 유형</legend><div class="st-mode-options"><label><input id="mode-1" type="radio" name="mode" value="email" checked><span data-ko="이메일 주소" data-en="Email addresses">이메일 주소</span></label><label><input id="mode-2" type="radio" name="mode" value="url"><span data-ko="URL·도메인" data-en="URLs and domains">URL·도메인</span></label><label><input id="mode-3" type="radio" name="mode" value="phone"><span data-ko="전화번호" data-en="Phone numbers">전화번호</span></label><label><input id="mode-4" type="radio" name="mode" value="social"><span data-ko="해시태그·멘션" data-en="Hashtags and mentions">해시태그·멘션</span></label></div></fieldset>
  <div class="st-field"><label class="st-label" for="text" data-ko="원본 텍스트" data-en="Source text">원본 텍스트</label><textarea id="text" maxlength="100000" data-ko-placeholder="정보를 찾을 글을 붙여 넣으세요." data-en-placeholder="Paste the text you want to scan.">문의: hello@example.com
사이트: https://example.com/news
전화: 010-1234-5678
태그: #툴박스 @openworld</textarea></div>
  <div class="st-actions"><button class="st-primary" id="sg-run" type="button" data-ko="정보 추출" data-en="Extract">정보 추출</button><button class="st-secondary" id="sg-copy" type="button" data-ko="결과 복사" data-en="Copy result">결과 복사</button><button class="st-secondary" id="extract-save" type="button" data-ko="TXT 저장" data-en="Save TXT">TXT 저장</button><button class="st-secondary" id="sg-reset" type="button" data-ko="초기화" data-en="Reset">초기화</button></div>
  <p class="st-status" id="sg-status" aria-live="polite"></p><section class="st-result" id="sg-result" hidden><h2 data-ko="추출 결과" data-en="Extracted results">추출 결과</h2><div id="sg-output"></div></section><textarea class="st-copy-fallback" id="sg-fallback" readonly hidden></textarea>
</article>
<script type="module" src="./tool.js?v=0.0.6"></script>
</body>
</html>
