<!doctype html>
<html lang="ko">
<head>
  <!-- toolbox-indexing:start -->
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://bloggiedh.blogspot.com/2026/08/ip.html">
  <!-- toolbox-indexing:end -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IP·네트워크 주소 도구</title>
  <link rel="stylesheet" href="../../assets/simple-tools.css?v=0.1.1">
  <link rel="stylesheet" href="../../assets/generated-tools.css?v=0.1.0">
  <link rel="stylesheet" href="../../assets/toolbox-i18n.css?v=0.1.0">
  <script src="../../assets/toolbox-i18n.js?v=0.3.0"></script>
  <script src="../../assets/toolbox-ux.js?v=0.1.0"></script>
</head>
<body>
<article class="simple-tool" aria-label="IP·네트워크 주소 도구">
  <div class="st-field"><label class="st-label" for="mode" data-ko="작업 유형" data-en="Operation">작업 유형</label><select id="mode"><option value="cidr" data-ko="IPv4 CIDR 서브넷" data-en="IPv4 CIDR subnet">IPv4 CIDR 서브넷</option><option value="mask" data-ko="프리픽스·마스크 변환" data-en="Prefix and mask">프리픽스·마스크 변환</option><option value="range" data-ko="IP 범위를 CIDR로" data-en="IP range to CIDR">IP 범위를 CIDR로</option><option value="mac" data-ko="MAC 주소 정리" data-en="Normalize MAC address">MAC 주소 정리</option><option value="convert" data-ko="IPv4 표현 변환" data-en="IPv4 representation conversion">IPv4 표현 변환</option></select></div>
  <div class="st-field" data-show-field="mode" data-show-values="cidr"><label class="st-label" for="ipCidr">IPv4/CIDR</label><input id="ipCidr" type="text" maxlength="32" value="192.168.10.25/24" data-ko-placeholder="예: 192.168.10.25/24" data-en-placeholder="Example: 192.168.10.25/24"></div>
  <div class="st-field" data-show-field="mode" data-show-values="mask"><label class="st-label" for="prefix" data-ko="CIDR 프리픽스" data-en="CIDR prefix">CIDR 프리픽스</label><input id="prefix" type="number" min="0" max="32" step="1" value="24"></div>
  <div class="st-field" data-show-field="mode" data-show-values="range"><label class="st-label" for="startIp" data-ko="시작 IPv4" data-en="Start IPv4">시작 IPv4</label><input id="startIp" type="text" maxlength="15" value="192.168.10.0" data-ko-placeholder="예: 192.168.10.0" data-en-placeholder="Example: 192.168.10.0"></div>
  <div class="st-field" data-show-field="mode" data-show-values="range"><label class="st-label" for="endIp" data-ko="끝 IPv4" data-en="End IPv4">끝 IPv4</label><input id="endIp" type="text" maxlength="15" value="192.168.10.255" data-ko-placeholder="예: 192.168.10.255" data-en-placeholder="Example: 192.168.10.255"></div>
  <div class="st-field" data-show-field="mode" data-show-values="mac"><label class="st-label" for="mac" data-ko="MAC 주소" data-en="MAC address">MAC 주소</label><input id="mac" type="text" maxlength="32" value="00-1A-2B-3C-4D-5E" data-ko-placeholder="예: 00-1A-2B-3C-4D-5E" data-en-placeholder="Example: 00-1A-2B-3C-4D-5E"></div>
  <div class="st-field" data-show-field="mode" data-show-values="convert"><label class="st-label" for="ipValue" data-ko="IPv4·정수·16진수" data-en="IPv4, integer, or hexadecimal">IPv4·정수·16진수</label><input id="ipValue" type="text" maxlength="50" value="192.168.10.25" data-ko-placeholder="예: 192.168.10.25, 3232238105, 0xC0A80A19" data-en-placeholder="Example: 192.168.10.25, 3232238105, 0xC0A80A19"><p class="st-help" data-ko="점 표기 IPv4, 0~4294967295 정수 또는 0x 16진수를 입력하세요." data-en="Enter dotted IPv4, an integer from 0 to 4294967295, or 0x hexadecimal.">점 표기 IPv4, 0~4294967295 정수 또는 0x 16진수를 입력하세요.</p></div>
  <div class="st-actions" aria-label="대표 프리픽스"><button class="st-secondary ip-prefix" type="button" data-prefix="16">/16</button><button class="st-secondary ip-prefix" type="button" data-prefix="24">/24</button><button class="st-secondary ip-prefix" type="button" data-prefix="26">/26</button><button class="st-secondary ip-prefix" type="button" data-prefix="32">/32</button></div>
  <div class="st-actions"><button class="st-primary" id="sg-run" type="button" data-ko="주소 계산" data-en="Calculate">주소 계산</button><button class="st-secondary" id="sg-copy" type="button" data-ko="결과 복사" data-en="Copy result">결과 복사</button><button class="st-secondary" id="sg-reset" type="button" data-ko="초기화" data-en="Reset">초기화</button></div>
  <p class="st-status" id="sg-status" aria-live="polite"></p>
  <section class="st-result" id="sg-result" hidden><h2 data-ko="네트워크 주소 결과" data-en="Network address results">네트워크 주소 결과</h2><div id="sg-output"></div></section>
  <textarea class="st-copy-fallback" id="sg-fallback" readonly hidden></textarea>
</article>
<script type="module" src="./tool.js?v=0.1.2"></script>
</body>
</html>
