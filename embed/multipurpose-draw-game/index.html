<!doctype html>
<html lang="ko">
<head>
  <!-- toolbox-indexing:start -->
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://bloggiedh.blogspot.com/2026/07/blog-post_15.html">
  <!-- toolbox-indexing:end -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>다용도 뽑기게임</title>
  <link rel="stylesheet" href="../../assets/funbox.css?v=0.0.3">
  <link rel="stylesheet" href="../../assets/toolbox-i18n.css?v=0.1.0">
  <script src="../../assets/toolbox-i18n.js?v=0.4.0"></script>
<script src="../../assets/toolbox-ux.js?v=0.1.0"></script>
</head>
<body>
  <main class="funbox" aria-labelledby="funbox-title">
    <section class="funbox-picker">
      <h1 id="funbox-title" data-ko="게임 선택" data-en="Choose a game">게임 선택</h1>
      <p class="funbox-help" data-ko="원하는 방식을 선택하세요. 모드를 바꿔도 각 게임의 입력과 결과가 유지됩니다." data-en="Choose a mode. Each game keeps its inputs and results when you switch.">원하는 방식을 선택하세요. 모드를 바꿔도 각 게임의 입력과 결과가 유지됩니다.</p>
      <p class="funbox-help" data-ko="Alt + Shift + 좌우 방향키로 이전·다음 게임을 열 수 있습니다." data-en="Press Alt + Shift + Left/Right Arrow to switch games.">Alt + Shift + 좌우 방향키로 이전·다음 게임을 열 수 있습니다.</p>
      <fieldset class="funbox-modes" id="funbox-modes" tabindex="0" aria-label="뽑기게임 선택"></fieldset>
      <button class="funbox-next" id="funbox-previous" type="button" data-ko="이전 게임 보기" data-en="Show previous game">이전 게임 보기</button>
      <button class="funbox-next" id="funbox-random" type="button" data-ko="임의 게임 고르기" data-en="Pick a random game">임의 게임 고르기</button>
      <button class="funbox-next" id="funbox-next" type="button" data-ko="다음 게임 보기" data-en="Show next game">다음 게임 보기</button>
      <button class="funbox-next" id="funbox-copy-link" type="button" data-ko="현재 게임 링크 복사" data-en="Copy current game link">현재 게임 링크 복사</button>
      <a class="funbox-next" id="funbox-open-game" href="./" target="_blank" rel="noopener" data-ko="현재 게임만 열기" data-en="Open current game only">현재 게임만 열기</a>
      <input class="funbox-link" id="funbox-link-fallback" type="text" readonly hidden aria-label="직접 복사할 게임 링크" data-ko-aria-label="직접 복사할 게임 링크" data-en-aria-label="Game link to copy manually">
    </section>
    <p class="funbox-status" id="funbox-status" data-ko="게임 모듈을 준비하고 있습니다." data-en="Preparing game modules.">게임 모듈을 준비하고 있습니다.</p>
    <section class="funbox-stage" id="funbox-stage" aria-live="polite"></section>
  </main>
  <script type="module">
    const registryUrl = new URL('./modules.json', location.href);
    const modeRoot = document.querySelector('#funbox-modes');
    const stage = document.querySelector('#funbox-stage');
    const status = document.querySelector('#funbox-status');
    const storedModeKey = 'multipurpose-draw-game-mode';
    const frames = new Map();
    const modulesByTool = new Map();
    const loadedFrames = new WeakSet();
    let modules = [];
    let activeId = '';
    const isEnglish = () => window.ToolboxI18n?.language === 'en';
    const syncModeLabel = () => modeRoot.setAttribute('aria-label', isEnglish() ? 'Game selection' : '뽑기게임 선택');
    syncModeLabel();

    function notifyHeight() {
      const height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
      parent.postMessage({ source: 'toolbox-embed', tool: 'multipurpose-draw-game', height: Math.ceil(height) }, '*');
    }

    function readStoredMode() {
      try { return localStorage.getItem(storedModeKey); } catch (_) { return ''; }
    }

    function storeMode(id) {
      try { localStorage.setItem(storedModeKey, id); } catch (_) {}
    }

    function readUrlMode() {
      return new URL(location.href).searchParams.get('mode') || '';
    }

    function storeUrlMode(id) {
      const url = new URL(location.href);
      url.searchParams.set('mode', id);
      history.replaceState(null, '', url);
    }

    function moduleUrl(module, initialId) {
      const url = new URL(module.entry, registryUrl);
      if (module.id === initialId) {
        const resultCode = new URL(location.href).searchParams.get('result');
        if (resultCode) url.searchParams.set('result', resultCode);
      }
      return url;
    }

    function announce(module, loading) {
      stage.setAttribute('aria-busy', loading ? 'true' : 'false');
      status.textContent = isEnglish()
        ? (loading ? `Loading ${module.label.en}.` : `${module.label.en} is ready.`)
        : (loading ? `${module.label.ko} 게임을 불러오는 중입니다.` : `${module.label.ko} 게임을 시작할 수 있습니다.`);
    }

    function activate(id, persist = true) {
      if (!frames.has(id)) return;
      activeId = id;
      for (const [moduleId, frame] of frames) {
        frame.hidden = moduleId !== id;
        if (moduleId === id && !frame.hasAttribute('src')) frame.src = frame.dataset.src;
      }
      const input = modeRoot.querySelector(`input[value="${CSS.escape(id)}"]`);
      if (input) input.checked = true;
      const module = modules.find((item) => item.id === id);
      if (module) { announce(module, !loadedFrames.has(frames.get(id))); document.querySelector('#funbox-open-game').href = new URL(module.entry, registryUrl); }
      if (persist) { storeMode(id); storeUrlMode(id); }
      document.querySelector('#funbox-link-fallback').hidden = true;
      requestAnimationFrame(notifyHeight);
    }

    function buildModule(module, index, initialId) {
      const option = document.createElement('label');
      option.className = 'funbox-option';
      option.innerHTML = `<input type="radio" name="funbox-mode" value="${module.id}"${index === 0 ? ' checked' : ''}><span data-ko="${module.label.ko}" data-en="${module.label.en}">${isEnglish()?module.label.en:module.label.ko}</span>`;
      option.querySelector('input').addEventListener('change', () => activate(module.id));
      modeRoot.append(option);

      const frame = document.createElement('iframe');
      frame.className = 'funbox-frame';
      frame.dataset.src = moduleUrl(module, initialId).toString();
      frame.title = `${module.label.ko} / ${module.label.en}`;
      frame.loading = 'lazy';
      frame.scrolling = 'no';
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.allow = 'clipboard-write';
      frame.hidden = index !== 0;
      frame.addEventListener('load', () => {
        loadedFrames.add(frame);
        if (module.id === activeId) announce(module, false);
        notifyHeight();
      });
      stage.append(frame);
      frames.set(module.id, frame);
      modulesByTool.set(module.messageTool, module);
    }

    modeRoot.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) return;
      const inputs = [...modeRoot.querySelectorAll('input[type="radio"]')];
      const current = inputs.indexOf(document.activeElement);
      if (current < 0 || !inputs.length) return;
      event.preventDefault();
      let next = current;
      if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = inputs.length - 1;
      else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') next = (current - 1 + inputs.length) % inputs.length;
      else next = (current + 1) % inputs.length;
      inputs[next].checked = true;
      activate(inputs[next].value);
      window.ToolboxUX?.focus(inputs[next]);
    });

    addEventListener('keydown', (event) => {
      if (!event.altKey || !event.shiftKey || !['ArrowLeft', 'ArrowRight'].includes(event.key) || event.isComposing || !modules.length) return;
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement || event.target instanceof HTMLSelectElement || event.target?.isContentEditable) return;
      event.preventDefault();
      const current = Math.max(0, modules.findIndex((item) => item.id === activeId));
      const direction = event.key === 'ArrowLeft' ? -1 : 1;
      activate(modules[(current + direction + modules.length) % modules.length].id);
    });

    document.querySelector('#funbox-next').addEventListener('click', () => {
      if (!modules.length) return;
      const current = Math.max(0, modules.findIndex((item) => item.id === activeId));
      activate(modules[(current + 1) % modules.length].id);
    });

    document.querySelector('#funbox-previous').addEventListener('click', () => {
      if (!modules.length) return;
      const current = Math.max(0, modules.findIndex((item) => item.id === activeId));
      activate(modules[(current - 1 + modules.length) % modules.length].id);
    });

    document.querySelector('#funbox-random').addEventListener('click', () => {
      if (!modules.length) return;
      const candidates = modules.filter((item) => item.id !== activeId);
      const pool = candidates.length ? candidates : modules;
      activate(pool[Math.floor(Math.random() * pool.length)].id);
    });

    document.querySelector('#funbox-copy-link').addEventListener('click', async () => {
      const link = location.href;
      let copied = false;
      try { await navigator.clipboard.writeText(link); copied = true; } catch (_) {
        const helper = document.createElement('textarea'); helper.value = link; helper.style.position = 'fixed'; helper.style.opacity = '0'; document.body.append(helper); helper.select();
        try { copied = document.execCommand('copy'); } catch (_) { copied = false; }
        helper.remove();
      }
      if (copied) { document.querySelector('#funbox-link-fallback').hidden = true; status.textContent = isEnglish() ? 'Copied the current game link.' : '현재 게임 링크를 복사했습니다.'; }
      else { const fallback = document.querySelector('#funbox-link-fallback'); fallback.value = link; fallback.hidden = false; status.textContent = isEnglish() ? 'Copy the link shown below manually.' : '아래 링크를 직접 선택해 복사해 주세요.'; }
      requestAnimationFrame(notifyHeight);
    });

    addEventListener('message', (event) => {
      if (event.origin !== location.origin || !event.data) return;
      const module = modulesByTool.get(event.data.tool);
      const frame = module && frames.get(module.id);
      if (!frame || event.source !== frame.contentWindow) return;
      if (event.data.source === 'toolbox-result') {
        const offset = Number(event.data.offset);
        if (!Number.isFinite(offset) || offset < 0 || offset > 6000) return;
        parent.postMessage({ source: 'toolbox-embed', tool: 'multipurpose-draw-game', action: 'result-restored', offset: Math.min(6000, Math.ceil(frame.offsetTop + offset)) }, '*');
        return;
      }
      if (event.data.source !== 'toolbox-embed') return;
      const height = Number(event.data.height);
      if (!Number.isFinite(height) || height < 260) return;
      const capped = Math.min(6000, Math.ceil(height));
      frame.style.height = `${capped}px`;
      frame.scrolling = height > 6000 ? 'yes' : 'no';
      if (module.id === activeId) requestAnimationFrame(notifyHeight);
    });

    try {
      const response = await fetch(registryUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error('모듈 목록을 불러오지 못했습니다.');
      const documentData = await response.json();
      modules = Array.isArray(documentData.modules) ? documentData.modules : [];
      if (modules.length !== 4) throw new Error('사용할 게임 모듈을 확인해 주세요.');
      const preferred = readUrlMode() || readStoredMode();
      const initialId = modules.some((item) => item.id === preferred) ? preferred : modules[0].id;
      modules.forEach((module, index) => buildModule(module, index, initialId));
      activate(initialId, false);
    } catch (error) {
      status.textContent = error.message;
      status.setAttribute('role', 'alert');
    }

    addEventListener('toolbox-language-change', () => {
      syncModeLabel();
      const module = modules.find((item) => item.id === activeId);
      if (module) announce(module, !loadedFrames.has(frames.get(activeId)));
      else status.textContent = isEnglish() ? 'Preparing game modules.' : '게임 모듈을 준비하고 있습니다.';
      for (const frame of frames.values()) { try { frame.contentWindow?.ToolboxI18n?.setLanguage(isEnglish() ? 'en' : 'ko'); } catch (_) {} }
      requestAnimationFrame(notifyHeight);
    });

    new ResizeObserver(notifyHeight).observe(document.body);
    addEventListener('load', notifyHeight);
  </script>
  <script src="../../assets/toolbox-workflow-actions.js?v=0.7.0" data-root=".funbox" data-status-target="#funbox-status" data-start-target="#funbox-modes" data-result-target="#funbox-stage" data-reset="false" data-secondary-class="funbox-next" data-action-anchor="#funbox-status"></script>
</body>
</html>
