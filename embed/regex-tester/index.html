<!doctype html>
<html lang="ko">
<head>
  <!-- toolbox-indexing:start -->
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://bloggiedh.blogspot.com/2026/07/blog-post_18.html">
  <!-- toolbox-indexing:end -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>정규식 테스트 도구</title>
  <link rel="stylesheet" href="../../assets/simple-tools.css?v=0.1.1">
  <link rel="stylesheet" href="../../assets/workflow-tools.css?v=0.0.6">
  <link rel="stylesheet" href="../../assets/toolbox-i18n.css?v=0.1.0">
  <script src="../../assets/toolbox-i18n.js?v=0.4.0"></script>
  <script src="../../assets/toolbox-ux.js?v=0.1.0"></script>
</head>
<body>
<article class="simple-tool" aria-label="정규식 테스트 도구" data-ko-aria-label="정규식 테스트 도구" data-en-aria-label="Regular expression tester">
  <div class="st-field">
    <label class="st-label" for="regex-pattern" data-ko="정규식 패턴" data-en="Regular expression pattern">정규식 패턴</label>
    <input id="regex-pattern" type="text" maxlength="500" value="[가-힣]+" placeholder="예: [가-힣]+" data-ko-placeholder="예: [가-힣]+" data-en-placeholder="Example: [A-Za-z]+" spellcheck="false">
    <p class="st-help" data-ko="양쪽 슬래시 없이 패턴 내용만 입력하세요." data-en="Enter the pattern without surrounding slashes.">양쪽 슬래시 없이 패턴 내용만 입력하세요.</p>
  </div>
  <label class="st-check"><input id="regex-replace-enabled" type="checkbox"><span data-ko="치환 결과도 만들기" data-en="Build replacement preview">치환 결과도 만들기</span></label>
  <div class="st-field" id="regex-replacement-field" hidden>
    <label class="st-label" for="regex-replacement" data-ko="치환식" data-en="Replacement expression">치환식</label>
    <input id="regex-replacement" type="text" maxlength="5000" data-ko-placeholder="예: [$&] 또는 $1" data-en-placeholder="Example: [$&] or $1" spellcheck="false">
    <p class="st-help" data-ko="$&는 일치한 전체 문자열, $1은 첫 번째 캡처 그룹을 뜻합니다." data-en="$& means the full match and $1 means the first capture group.">$&는 일치한 전체 문자열, $1은 첫 번째 캡처 그룹을 뜻합니다.</p>
  </div>
  <fieldset class="st-mode">
    <legend data-ko="플래그" data-en="Flags">플래그</legend>
    <div class="st-mode-options">
      <label><input name="regex-flag" type="checkbox" value="g" checked><span data-ko="전체 찾기 (g)" data-en="Find all (g)">전체 찾기 (g)</span></label>
      <label><input name="regex-flag" type="checkbox" value="i"><span data-ko="대소문자 무시 (i)" data-en="Ignore case (i)">대소문자 무시 (i)</span></label>
      <label><input name="regex-flag" type="checkbox" value="m"><span data-ko="여러 줄 (m)" data-en="Multiline (m)">여러 줄 (m)</span></label>
      <label><input name="regex-flag" type="checkbox" value="s"><span data-ko="줄바꿈 포함 (s)" data-en="Dot matches newline (s)">줄바꿈 포함 (s)</span></label>
    </div>
  </fieldset>
  <div class="st-field">
    <label class="st-label" for="regex-text" data-ko="테스트 텍스트" data-en="Test text">테스트 텍스트</label>
    <textarea id="regex-text" maxlength="50000" spellcheck="false">Hello 정규식 tester
두 번째 한글 문장</textarea>
  </div>
  <div class="st-actions" aria-label="정규식 예제"><button class="st-secondary regex-preset" type="button" data-pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" data-text="문의: hello@example.com" data-ko="이메일 예제" data-en="Email example">이메일 예제</button><button class="st-secondary regex-preset" type="button" data-pattern="\d+" data-text="주문 12개, 재고 345개" data-ko="숫자 예제" data-en="Number example">숫자 예제</button><button class="st-secondary regex-preset" type="button" data-pattern="https?://[^\s]+" data-text="문서: https://example.com/guide" data-ko="URL 예제" data-en="URL example">URL 예제</button><button class="st-secondary regex-preset" type="button" data-pattern="(?:\d{1,3}\.){3}\d{1,3}" data-text="서버 192.168.0.10, 게이트웨이 192.168.0.1" data-ko="IPv4 예제" data-en="IPv4 example">IPv4 예제</button></div>
  <div class="st-actions">
    <button class="st-primary" id="regex-run" type="button" data-ko="일치 항목 찾기" data-en="Find matches">일치 항목 찾기</button>
    <button class="st-secondary" id="regex-copy" type="button" data-ko="결과 복사" data-en="Copy results">결과 복사</button>
    <button class="st-secondary" id="regex-copy-json" type="button" data-ko="JSON 결과 복사" data-en="Copy JSON results">JSON 결과 복사</button>
    <button class="st-secondary" id="regex-reset" type="button" data-ko="초기화" data-en="Reset">초기화</button>
  </div>
  <p class="st-status" id="regex-status" role="status" aria-live="polite"></p>
  <textarea class="st-copy-fallback" id="regex-fallback" readonly hidden></textarea>
  <section class="st-result" id="regex-result" hidden>
    <h2 data-ko="일치 결과" data-en="Match results">일치 결과</h2>
    <p class="st-result-detail" id="regex-summary"></p>
    <div class="wf-highlight" id="regex-highlight" aria-label="일치 부분이 강조된 텍스트" data-ko-aria-label="일치 부분이 강조된 텍스트" data-en-aria-label="Text with matches highlighted"></div>
    <ol class="wf-match-list" id="regex-list"></ol>
    <div class="st-field" id="regex-replacement-result" hidden><label class="st-label" for="regex-replacement-output" data-ko="치환 결과" data-en="Replacement result">치환 결과</label><textarea id="regex-replacement-output" readonly spellcheck="false"></textarea><button class="st-secondary" id="regex-copy-replacement" type="button" data-ko="치환 결과 복사" data-en="Copy replacement result">치환 결과 복사</button></div>
  </section>
</article>
<script type="module" src="./tool.js?v=0.2.5"></script>
<script src="../../assets/toolbox-workflow-actions.js?v=0.7.0" data-primary="#regex-run" data-reset-shortcut="true" data-copy-shortcut="#regex-copy-json" data-start-target="#regex-pattern" data-start-ko="정규식 입력으로 이동" data-start-en="Go to pattern input" data-result-target="#regex-result" data-file-targets="#regex-text|테스트 문장|test text" data-save-targets="#regex-text|테스트 문장|test text|toolbox-regex-test.txt"></script>
</body>
</html>
