<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>글자수·텍스트 정리기</title>
  <link rel="stylesheet" href="../../assets/simple-tools.css?v=0.1.1">
  <link rel="stylesheet" href="../../assets/workflow-tools.css?v=0.0.6">
  <link rel="stylesheet" href="../../assets/toolbox-i18n.css?v=0.1.0">
  <script src="../../assets/toolbox-i18n.js?v=0.3.1"></script>
  <script src="../../assets/toolbox-ux.js?v=0.1.0"></script>
</head>
<body>
<article class="simple-tool" aria-label="글자수·텍스트 정리기" data-ko-aria-label="글자수·텍스트 정리기" data-en-aria-label="Text counter and cleaner">
  <div class="st-field"><label class="st-label" for="text-input" data-ko="원본 텍스트" data-en="Source text">원본 텍스트</label><textarea id="text-input" maxlength="100000" aria-describedby="text-capacity" data-ko-placeholder="글자수를 세거나 정리할 텍스트를 입력하세요." data-en-placeholder="Enter text to count or clean."></textarea><p class="st-help" id="text-capacity" aria-live="polite">0 / 100,000</p></div>
  <div class="wf-stats">
    <div class="wf-stat"><span data-ko="공백 포함" data-en="With spaces">공백 포함</span><strong id="count-all">0</strong></div>
    <div class="wf-stat"><span data-ko="공백 제외" data-en="Without spaces">공백 제외</span><strong id="count-no-space">0</strong></div>
    <div class="wf-stat"><span data-ko="단어" data-en="Words">단어</span><strong id="count-words">0</strong></div>
    <div class="wf-stat"><span data-ko="줄" data-en="Lines">줄</span><strong id="count-lines">0</strong></div>
    <div class="wf-stat"><span data-ko="문장" data-en="Sentences">문장</span><strong id="count-sentences">0</strong></div>
    <div class="wf-stat"><span data-ko="문단" data-en="Paragraphs">문단</span><strong id="count-paragraphs">0</strong></div>
    <div class="wf-stat"><span data-ko="읽기 시간" data-en="Reading time">읽기 시간</span><strong id="count-reading">0분</strong></div>
    <div class="wf-stat"><span>UTF-8 용량</span><strong id="count-bytes">0 B</strong></div>
  </div>
  <section class="st-result" id="text-frequency"><h2 data-ko="자주 나온 단어" data-en="Frequent words">자주 나온 단어</h2><p class="st-result-detail" id="text-frequency-value" data-ko="입력하면 상위 5개를 표시합니다." data-en="Enter text to see the top five words.">입력하면 상위 5개를 표시합니다.</p></section>
  <fieldset class="st-mode"><legend data-ko="텍스트 정리 옵션" data-en="Cleanup options">텍스트 정리 옵션</legend><div class="wf-option-list"><label class="st-check"><input id="clean-trim" type="checkbox" checked><span data-ko="줄 앞뒤 공백 제거" data-en="Trim each line">줄 앞뒤 공백 제거</span></label><label class="st-check"><input id="clean-spaces" type="checkbox" checked><span data-ko="연속 공백 하나로" data-en="Collapse repeated spaces">연속 공백 하나로</span></label><label class="st-check"><input id="clean-lines" type="checkbox" checked><span data-ko="빈 줄 하나만 남기기" data-en="Keep one blank line">빈 줄 하나만 남기기</span></label><label class="st-check"><input id="clean-breaks" type="checkbox"><span data-ko="줄바꿈을 공백으로" data-en="Replace line breaks with spaces">줄바꿈을 공백으로</span></label></div></fieldset>
  <div class="st-actions"><button class="st-primary" id="text-clean" type="button" data-ko="선택한 방식으로 정리" data-en="Clean with selected options">선택한 방식으로 정리</button><button class="st-secondary" id="text-copy" type="button" data-ko="결과 복사" data-en="Copy result">결과 복사</button><button class="st-secondary" id="text-save" type="button" data-ko="TXT로 저장" data-en="Save as TXT">TXT로 저장</button><button class="st-secondary" id="text-reset" type="button" data-ko="초기화" data-en="Reset">초기화</button></div>
  <p class="st-status" id="text-status" aria-live="polite" data-ko="입력과 동시에 글자수와 UTF-8 용량을 계산합니다." data-en="Counts characters and UTF-8 size as you type.">입력과 동시에 글자수와 UTF-8 용량을 계산합니다.</p>
  <div class="st-field"><label class="st-label" for="text-output" data-ko="정리 결과" data-en="Cleaned result">정리 결과</label><textarea class="wf-output-text" id="text-output" readonly data-ko-placeholder="정리한 결과가 여기에 표시됩니다." data-en-placeholder="The cleaned result appears here."></textarea></div>
  <textarea class="st-copy-fallback" id="text-fallback" aria-label="직접 복사할 결과" readonly hidden></textarea>
</article>
<script type="module" src="./tool.js?v=0.2.0"></script>
<script src="../../assets/toolbox-workflow-actions.js?v=0.5.0" data-primary="#text-clean" data-reset-shortcut="true" data-save-shortcut="#text-save" data-file-targets="#text-input|원문|source text" data-save-targets="#text-input|원문 TXT|source TXT|toolbox-source.txt"></script>
</body>
</html>
